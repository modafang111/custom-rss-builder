<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サンプル5 — table</title>
</head>
<body>
  <p><small>CRB 練習用 — 範囲: <code>table.crb-sample-table</code> / 1件: <code>tbody tr</code></small></p>
  <h1>表形式一覧（パターン5）</h1>

  <table class="crb-sample-table">
    <thead>
      <tr><th>タイトル</th><th>日付</th></tr>
    </thead>
    <tbody>
      <tr>
        <td><a href="https://example.com/row/1">表の行サンプル 1</a></td>
        <td>2026-05-20</td>
      </tr>
      <tr>
        <td><a href="https://example.com/row/2">表の行サンプル 2</a></td>
        <td>2026-05-19</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
