<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サンプル4 — 入れ子の一覧</title>
</head>
<body>
  <p><small>CRB 練習用 — 範囲: <code>.crb-sample-feed</code> / 1件: <code>.crb-sample-feed_list_item</code></small></p>
  <h1>フィード風一覧（パターン4）</h1>

  <div class="crb-sample-feed">
    <ul class="crb-sample-feed_list">
      <li class="crb-sample-feed_list_item">
        <a href="https://example.com/feed/1" class="crb-sample-feed_link">見出しサンプル 1</a>
        <time class="crb-sample-feed_date">2026-05-26</time>
      </li>
      <li class="crb-sample-feed_list_item">
        <a href="https://example.com/feed/2" class="crb-sample-feed_link">見出しサンプル 2</a>
        <time class="crb-sample-feed_date">2026-05-25</time>
      </li>
    </ul>
  </div>
</body>
</html>
