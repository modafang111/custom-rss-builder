<!DOCTYPE html>
<html lang="ja">
<head>

  <title>サンプル3 — ul / li</title>
</head>
<body>

  <h1>リンク一覧（パターン3）</h1>

  <ul class="crb-sample-ul">
    <li class="crb-sample-li">
      <a class="crb-sample-link" href="https://example.com/topics/1">トピック A の見出し</a>
    </li>
    <li class="crb-sample-li">
      <a class="crb-sample-link" href="https://example.com/topics/2">トピック B の見出し</a>
    </li>
    <li class="crb-sample-li">
      <a class="crb-sample-link" href="https://example.com/topics/3">トピック C の見出し</a>
    </li>
  </ul>
</body>
</html>
